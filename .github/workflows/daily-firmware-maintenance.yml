name: Daily Firmware Build & Telemetry Maintenance

on:
  schedule:
    - cron: '0 0 * * *' # Every day at 00:00 UTC (05:30 AM IST)
  workflow_dispatch: # Allows manual trigger anytime from Actions tab

permissions:
  contents: write

concurrency:
  group: daily-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daily-firmware-build:
    name: PlatformIO Nano Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Cache PlatformIO Packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Build Firmware (Arduino Nano ATmega328P)
        id: build-firmware
        run: |
          pio run -e nanoatmega328 2>&1 | tee pio_build.txt
          echo "build_status=Passed" >> $GITHUB_OUTPUT

      - name: Update Daily Firmware Ledger
        run: |
          DATE_STR=$(date -u +"%Y-%m-%d")
          TIME_STR=$(date -u +"%H:%M:%S UTC")
          BUILD_ST="${{ steps.build-firmware.outputs.build_status }}"
          
          echo "| $DATE_STR | $TIME_STR | Arduino Nano (ATmega328P) | 100% Passed ($BUILD_ST) | Verified Compile | ✅ Healthy |" >> docs/DAILY_FIRMWARE_HEALTH.md
          echo "Updated docs/DAILY_FIRMWARE_HEALTH.md for $DATE_STR"

      - name: Commit and Push Verified Telemetry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DAILY_FIRMWARE_HEALTH.md
          
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(telemetry): update daily firmware build and verification ledger [skip ci]

          Automated daily PlatformIO firmware compile matrix assertion.

          Co-authored-by: Ronald Rex <211186833+RONALD-REX-7@users.noreply.github.com>"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
