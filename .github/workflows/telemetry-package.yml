name: LumaGuard Telemetry package

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/lumaguard-telemetry/**"
      - ".github/workflows/telemetry-package.yml"
  push:
    branches: [main]
    paths:
      - "tools/lumaguard-telemetry/**"
      - ".github/workflows/telemetry-package.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "OCI image version to publish (for example 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  verify:
    name: Test Python package and container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/lumaguard-telemetry
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" build

      - name: Run unit tests
        run: python -m pytest -q

      - name: Build source and wheel distributions
        run: python -m build

      - name: Build container smoke-test image
        run: docker build --tag lumaguard-telemetry:ci .

      - name: Smoke-test container against bundled firmware log
        run: |
          docker run --rm \
            --volume "$PWD/examples:/input:ro" \
            lumaguard-telemetry:ci \
            convert /input/lumaguard-session.log > /tmp/lumaguard-session.jsonl
          python - <<'PY'
          import json
          from pathlib import Path
          rows = [json.loads(line) for line in Path("/tmp/lumaguard-session.jsonl").read_text().splitlines()]
          assert len(rows) == 8, f"Expected 8 parsed records, got {len(rows)}"
          assert rows[0]["record_type"] == "status"
          assert rows[5]["distance_cm"] is None
          print(f"Container smoke test passed: {len(rows)} valid JSONL records")
          PY

  publish:
    name: Publish multi-architecture GHCR image
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve and validate image version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="$(python -c 'import tomllib; print(tomllib.load(open("tools/lumaguard-telemetry/pyproject.toml", "rb"))["project"]["version"])')"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image version: $VERSION" >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 and linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: ./tools/lumaguard-telemetry
          file: ./tools/lumaguard-telemetry/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lumaguard-telemetry:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/lumaguard-telemetry:latest
          labels: |
            org.opencontainers.image.title=LumaGuard Telemetry
            org.opencontainers.image.description=Convert and validate LumaGuard firmware serial logs as JSON Lines
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
